# Build the package and attach it to the GitHub Release when a version tag is pushed.
# Usage:  git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package with twine
      run: twine check dist/*

    - name: Smoke-test the wheel
      run: |
        pip install dist/*.whl
        python -c "
        from cosmohydro_emu import load_emulator, list_available_statistics
        stats = list_available_statistics()
        assert sum(len(v) for v in stats.values()) == 14
        emu = load_emulator('Pk-ratio')
        mean, std = emu.predict([3.0, 0.5, 1.0, 0.65, 0.5, 0.14176, 0.8102], z=0.45)
        print('wheel OK:', mean.shape)
        "

    - name: Create GitHub Release with artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
